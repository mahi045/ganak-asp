name: CI Build

on:
  push:
    branches: [competition-clean]
  pull_request:
    branches: [competition-clean]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libgmp-dev libmpfr-dev libboost-all-dev

      - name: Run build script
        run: |
          cd script
          ./build_norm.sh


